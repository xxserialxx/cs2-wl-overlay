<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CS2 W/L Kontrollpanel</title><style>*{box-sizing:border-box}body{background:#101014;color:#f8f7f9;font-family:Arial,sans-serif;margin:0;padding:32px 16px}.wrap{max-width:560px;margin:auto}.panel{border:1px solid #a42a44;background:linear-gradient(145deg,#242026,#141318);padding:25px;border-radius:14px;box-shadow:0 0 30px #6e182020}h1{margin:0 0 10px;font-size:25px}p{color:#b8b4bc}input{display:block;width:100%;padding:13px;margin:12px 0;background:#0b0b0f;border:1px solid #55414a;border-radius:8px;color:#fff;font-size:16px}button{cursor:pointer;background:#ad2847;color:white;border:0;border-radius:8px;padding:12px 17px;font-weight:bold;font-size:15px}button:disabled{opacity:.4;cursor:wait}.secondary{background:#36313a}.scores{display:flex;gap:12px;margin:22px 0}.score{flex:1;text-align:center;background:#0c0d11;border-radius:10px;padding:20px 10px}.number{font-size:56px;font-weight:900}.green{color:#4de2a8}.red{color:#ff536e}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions button{width:100%}.footer{display:flex;gap:10px;justify-content:space-between;margin-top:20px}#status{min-height:20px;font-size:14px;color:#f0b5c2;margin-top:15px}.hidden{display:none}</style></head><body><div class="wrap"><div class="panel"><h1>CS2 // SESSION CONTROL</h1><p>Slaughter × Printstream · kun for eieren</p><section id="login"><input id="email" type="email" placeholder="Firebase e-post" autocomplete="username"><input id="password" type="password" placeholder="Passord" autocomplete="current-password"><button id="signin">Logg inn</button></section><section id="controls" class="hidden"><div class="scores"><div class="score"><div class="number green" id="wins">0</div>WINS</div><div class="score"><div class="number red" id="losses">0</div>LOSSES</div></div><div class="actions"><button data-key="wins" data-delta="1">+1 WIN</button><button data-key="losses" data-delta="1">+1 LOSS</button><button class="secondary" data-key="wins" data-delta="-1">−1 WIN</button><button class="secondary" data-key="losses" data-delta="-1">−1 LOSS</button></div><div class="footer"><button class="secondary" id="reset">Nullstill begge</button><button class="secondary" id="signout">Logg ut</button></div></section><div id="status" role="status"></div></div></div><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';import{getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';import{getDatabase,ref,onValue,runTransaction,update}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js';const config={apiKey:'AIzaSyDlE51IeQeRnMjoLh5b4aCVC8kcrVI8Y7U',authDomain:'cs2-wl-counter.firebaseapp.com',databaseURL:'https://cs2-wl-counter-default-rtdb.europe-west1.firebasedatabase.app',projectId:'cs2-wl-counter',storageBucket:'cs2-wl-counter.firebasestorage.app',messagingSenderId:'109889823343',appId:'1:109889823343:web:ff631d264ab3d07f79e39a'};const app=initializeApp(config),auth=getAuth(app),db=getDatabase(app),status=document.getElementById('status');function msg(t){status.textContent=t}onAuthStateChanged(auth,user=>{document.getElementById('login').classList.toggle('hidden',!!user);document.getElementById('controls').classList.toggle('hidden',!user);msg(user?'Innlogget':'Logg inn for å endre resultater')});for(const key of ['wins','losses'])onValue(ref(db,key),s=>document.getElementById(key).textContent=s.val()??0,e=>msg('Lesefeil: '+e.code));document.getElementById('signin').onclick=async()=>{try{await signInWithEmailAndPassword(auth,document.getElementById('email').value.trim(),document.getElementById('password').value);document.getElementById('password').value=''}catch(e){msg('Innlogging feilet: '+e.code)}};document.getElementById('signout').onclick=()=>signOut(auth);for(const btn of document.querySelectorAll('[data-key]'))btn.onclick=async()=>{btn.disabled=true;try{const key=btn.dataset.key,delta=Number(btn.dataset.delta);await runTransaction(ref(db,key),v=>Math.max(0,Math.floor(Number(v??0))+delta));msg('Oppdatert')}catch(e){msg('Kunne ikke oppdatere: '+e.code)}finally{btn.disabled=false}};document.getElementById('reset').onclick=async()=>{if(!confirm('Nullstille både seire og tap?'))return;try{await update(ref(db),{wins:0,losses:0});msg('Nullstilt')}catch(e){msg('Nullstilling feilet: '+e.code)}};</script></body></html>
