<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CS2 Session W/L</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:Arial,Helvetica,sans-serif}.widget{width:100%;height:100%;min-height:100px;display:flex;align-items:center;justify-content:center;padding:8px}.frame{position:relative;display:flex;align-items:center;gap:20px;width:100%;max-width:900px;min-height:104px;padding:15px 27px;background:linear-gradient(115deg,#151519 0%,#24242b 48%,#120e12 100%);border:2px solid #d9dce3;clip-path:polygon(0 18%,3% 0,97% 0,100% 18%,100% 82%,97% 100%,3% 100%,0 82%);box-shadow:inset 0 0 0 3px #4c101b,inset 0 0 22px #9c1028}.frame:before,.frame:after{content:"";position:absolute;height:5px;width:34%;background:repeating-linear-gradient(115deg,#f23b53 0 16px,#6e1225 16px 28px);left:9%;top:0}.frame:after{left:auto;right:9%;top:auto;bottom:0}.heading{flex:1;min-width:0}.label{font-size:12px;letter-spacing:3px;color:#c7c9d1;font-weight:700}.name{font-size:clamp(15px,3.5vw,28px);font-weight:900;letter-spacing:1px;color:#fff;margin-top:5px}.stats{display:flex;align-items:center;gap:14px;white-space:nowrap}.stat{text-align:center;min-width:56px}.num{font-size:clamp(29px,6vw,48px);font-weight:900;line-height:1;color:#fff}.win .num{color:#69e0ac}.loss .num{color:#ff5268}.stat-label{font-size:11px;font-weight:800;letter-spacing:2px;color:#d3d3d9;margin-top:7px}.divider{height:50px;width:2px;background:linear-gradient(transparent,#ff435c,transparent)}.corner{position:absolute;right:12px;top:9px;width:30px;height:3px;background:#f43c57;transform:skew(-30deg)}@media(max-width:420px){.frame{padding:12px 16px;gap:10px}.stats{gap:8px}.stat{min-width:40px}.label{font-size:9px;letter-spacing:1px}.stat-label{font-size:9px}.divider{height:36px}}
</style>
</head>
<body><main class="widget"><section class="frame" aria-label="CS2 seier og tap"><div class="corner"></div><div class="heading"><div class="label">CS2 // LIVE</div><div class="name">SESSION RECORD</div></div><div class="stats"><div class="stat win"><div class="num" id="wins">0</div><div class="stat-label">WINS</div></div><div class="divider"></div><div class="stat loss"><div class="num" id="losses">0</div><div class="stat-label">LOSSES</div></div></div></section></main>
<script>
// Preview mode: numbers can be set via URL, e.g. ?w=3&l=1.
// Firebase live synchronization will be added after database setup.
const q=new URLSearchParams(location.search);for(const [param,id] of [['w','wins'],['l','losses']]){const raw=q.get(param);if(raw!==null&&/^\d{1,4}$/.test(raw))document.getElementById(id).textContent=String(Number(raw));}
</script></body></html>
