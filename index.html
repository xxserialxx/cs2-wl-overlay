<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CS2 Session W/L</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:Arial,Helvetica,sans-serif;color:#fff}.stage{height:100%;display:flex;align-items:center;justify-content:center;padding:2%}.panel{width:min(96vw,900px);min-height:102px;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:16px 26px;border:2px solid #a52b44;clip-path:polygon(2.5% 0,97.5% 0,100% 17%,100% 83%,97.5% 100%,2.5% 100%,0 83%,0 17%);background:linear-gradient(110deg,#141217,#242128 60%,#161217);box-shadow:inset 0 0 24px #6b162d}.label{font-size:12px;letter-spacing:3px;font-weight:700}.heading{font-size:clamp(19px,3.5vw,30px);font-weight:900;letter-spacing:1px;margin-top:6px}.stats{display:flex;gap:22px;text-align:center}.value{font-size:clamp(30px,5vw,50px);font-weight:900;line-height:1}.win{color:#4de2a8}.loss{color:#ff536e}.statlabel{font-size:10px;letter-spacing:2px;font-weight:800;margin-top:5px}.divider{width:1px;background:#aa3146}.error{position:fixed;bottom:4px;left:4px;font-size:11px;color:#ff9ca8}</style></head><body><div class="stage"><div class="panel"><div><div class="label">CS2 // LIVE</div><div class="heading">SESSION RECORD</div></div><div class="stats"><div><div id="wins" class="value win">0</div><div class="statlabel">WINS</div></div><div class="divider"></div><div><div id="losses" class="value loss">0</div><div class="statlabel">LOSSES</div></div></div></div></div><div class="error" id="error"></div><script type="module">import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';import {getDatabase,ref,onValue} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js';const config={apiKey:'AIzaSyDlE5I1eQeRnMjoLh5b4aCVC8kcrVI8Y7U',authDomain:'cs2-wl-counter.firebaseapp.com',databaseURL:'https://cs2-wl-counter-default-rtdb.europe-west1.firebasedatabase.app',projectId:'cs2-wl-counter',storageBucket:'cs2-wl-counter.firebasestorage.app',messagingSenderId:'109889823343',appId:'1:109889823343:web:ff631d264ab3d07f79e39a'};const db=getDatabase(initializeApp(config));for(const key of ['wins','losses'])onValue(ref(db,key),snap=>{document.getElementById(key).textContent=Number(snap.val()??0)},err=>document.getElementById('error').textContent='Database: '+err.code);</script></body></html>
